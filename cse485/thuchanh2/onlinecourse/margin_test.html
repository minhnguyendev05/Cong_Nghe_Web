<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin Top Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Test Margin Top</a>
        </div>
    </nav>

    <!-- Main Layout with 3% margin top -->
    <div class="main-layout-wrapper d-flex bg-light">
        <!-- Sidebar -->
        <div class="sidebar-modern bg-white border-end shadow-sm" style="width: 280px; min-height: calc(100vh - 76px);">
            <div class="p-3">
                <h5>Sidebar</h5>
                <p>This sidebar should have 3% margin from navbar</p>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content flex-grow-1">
            <div class="content-wrapper p-4">
                <h1>Main Content</h1>
                <p>The entire main layout should have 3% margin from the top (navbar).</p>
                <div class="alert alert-info">
                    <strong>Margin Test:</strong> Check if there's 3% space between navbar and main content.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
